<text x="64" y="64" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#22d3ee" font-weight="700" letter-spacing="3">PIPELINE</text>
<text x="64" y="104" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" fill="#e8eefb" font-weight="800">One source of truth, one gate, no hand-edited facts</text>
<text x="64" y="132" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8fa3bf" font-weight="400">Anything that contradicts versions.json fails before it can be published.</text>
