<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
<title id="t">QEMU evidence</title>
<desc id="d">Trimmed serial log of the trampoline probe.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="55%" stop-color="#0b1224"/>
    <stop offset="100%" stop-color="#070b16"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#121f38" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0f1a2e" stop-opacity="0.95"/>
  </linearGradient>
  <radialGradient id="glowc"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowv"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1b2740" stroke-width="1" stroke-opacity="0.5"/>
  </pattern>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa3bf"/></marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>
<rect width="1280" height="520" fill="url(#bg)"/>
<rect width="1280" height="520" fill="url(#grid)" opacity="0.35"/>
<circle cx="153" cy="0" r="409" fill="url(#glowc)"/>
<circle cx="1177" cy="520" r="358" fill="url(#glowv)"/>
<text x="64" y="60" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#22d3ee" font-weight="700" letter-spacing="3">EVIDENCE</text>
<text x="64" y="98" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" fill="#e8eefb" font-weight="800">Trampoline probe — serial log, trimmed</text>
<rect x="64" y="122" width="800" height="330" rx="14" fill="#05090f" stroke="#1b2740" stroke-width="1"/>
<rect x="64" y="122" width="800" height="34" rx="14" fill="#0b1220"/>
<circle cx="88" cy="139" r="5.5" fill="#fb7185" opacity="0.85"/>
<circle cx="106" cy="139" r="5.5" fill="#fbbf24" opacity="0.85"/>
<circle cx="124" cy="139" r="5.5" fill="#34d399" opacity="0.85"/>
<text x="160" y="144" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#64748b" font-weight="400">qemu-system-aarch64 · maxcpus=1 · exact stock Image</text>
<text x="88" y="190" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#8fa3bf" font-weight="500">[    2.804780] cfi: not using shadow for module ktramp</text>
<text x="88" y="232" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#8fa3bf" font-weight="500">[    2.939000] ktramp: target=ffffffc00843c0c0 patch=ffffffc009a10870</text>
<text x="88" y="274" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#e8eefb" font-weight="500">ktramp ... tramp=0xffffffc001a36000 patched=1 policy=1 calls=0</text>
<text x="88" y="316" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#34d399" font-weight="500">ktramp ... patched=1 policy=1 calls=426</text>
<text x="88" y="358" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#34d399" font-weight="500">pgscan_file 0            # baseline 7032</text>
<text x="88" y="400" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#22d3ee" font-weight="500">ktramp ... patched=0 policy=0 calls=426   # restored</text>
<circle cx="892" cy="145" r="4" fill="#22d3ee"/>
<text x="910" y="150" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefb" font-weight="700">CFI bridge</text>
<text x="910" y="169" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">non-LTO module accepted by the vendor CFI runtime</text>
<circle cx="892" cy="207" r="4" fill="#22d3ee"/>
<text x="910" y="212" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefb" font-weight="700">Symbols</text>
<text x="910" y="231" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">get_scan_count + patcher resolved via kprobe</text>
<circle cx="892" cy="269" r="4" fill="#22d3ee"/>
<text x="910" y="274" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefb" font-weight="700">Trampoline</text>
<text x="910" y="293" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">7 prologue instructions copied, branch back</text>
<circle cx="892" cy="331" r="4" fill="#22d3ee"/>
<text x="910" y="336" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefb" font-weight="700">Policy</text>
<text x="910" y="355" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">wrapper entered by real reclaim: 89 calls</text>
<circle cx="892" cy="393" r="4" fill="#22d3ee"/>
<text x="910" y="398" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefb" font-weight="700">Rollback</text>
<text x="910" y="417" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">original entry restored, no rmmod needed</text>
<text x="64" y="486" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#64748b" font-weight="400">Log: $PREFIX/tmp/ktramp-stagee.*/serial-*.log · replayed by tests/qemu_ktramp_gate.sh</text>
</svg>
