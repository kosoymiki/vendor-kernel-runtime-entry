<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="t d">
<title id="t">vmscan_hook mechanism</title>
<desc id="d">Custom shrink_lruvec through a module: text-patch entry, kernel list scanners, young-page rotation and the procfs control surface.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="55%" stop-color="#0b1224"/>
    <stop offset="100%" stop-color="#070b16"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#121f38" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0f1a2e" stop-opacity="0.95"/>
  </linearGradient>
  <radialGradient id="glowc"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowv"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1b2740" stroke-width="1" stroke-opacity="0.5"/>
  </pattern>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa3bf"/></marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>
<rect width="1280" height="540" fill="url(#bg)"/>
<rect width="1280" height="540" fill="url(#grid)" opacity="0.35"/>
<circle cx="153" cy="0" r="409" fill="url(#glowc)"/>
<circle cx="1177" cy="540" r="358" fill="url(#glowv)"/>
<text x="64" y="60" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#22d3ee" font-weight="700" letter-spacing="3">VMSSCAN_HOOK  ·  v1.1.0</text>
<text x="64" y="98" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" fill="#e8eefb" font-weight="800">A custom reclaim path without rebuilding vmscan</text>
<text x="64" y="126" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8fa3bf" font-weight="400">Four moving parts, each observable from /proc and replayed by tests/qemu_vmscan_stack_gate.sh.</text>
<rect x="64" y="158" width="560" height="148" rx="16" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="158" width="560" height="4" rx="2" fill="#22d3ee" opacity="0.85"/>
<text x="84" y="196" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700">1 · entry</text>
<text x="84" y="226" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">shrink_lruvec entry is replaced with `b my_shrink_lruvec` using</text>
<text x="84" y="245" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">aarch64_insn_patch_text under stop_machine; restore writes the</text>
<text x="84" y="264" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">original instructions back. No livepatch, no kernel rebuild.</text>
<rect x="656" y="158" width="560" height="148" rx="16" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="656" y="158" width="560" height="4" rx="2" fill="#a78bfa" opacity="0.85"/>
<text x="676" y="196" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700">2 · loop</text>
<text x="676" y="226" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">my_shrink_lruvec calls get_scan_count, then walks</text>
<text x="676" y="245" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">INACTIVE_ANON..ACTIVE_FILE and runs the kernel's own</text>
<text x="676" y="264" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">shrink_active_list / shrink_inactive_list with min(nr, 32),</text>
<text x="676" y="283" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">stopping at nr_to_reclaim.</text>
<rect x="64" y="326" width="560" height="148" rx="16" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="326" width="560" height="4" rx="2" fill="#34d399" opacity="0.85"/>
<text x="84" y="364" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700">3 · young-page rotation</text>
<text x="84" y="394" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">A kprobe on mark_page_accessed marks a page recent. If it sits</text>
<text x="84" y="413" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">on the file LRU inside the ttl window, it is moved to the list</text>
<text x="84" y="432" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">tail instead of being reclaimed: `moved` counts that rotation.</text>
<rect x="656" y="326" width="560" height="148" rx="16" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="656" y="326" width="560" height="4" rx="2" fill="#fbbf24" opacity="0.85"/>
<text x="676" y="364" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700">4 · control</text>
<text x="676" y="394" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">/proc/vmscan_hook: write 1 install, 0 restore, t&lt;ms&gt; ttl.</text>
<text x="676" y="413" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">read: hooked, calls, scans, reclaimed, moved, ttl_ms.</text>
<text x="676" y="432" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">Every number below was read from that file in QEMU.</text>
<rect x="64" y="476" width="1152" height="44" rx="12" fill="#0b1424" stroke="#1e2b45" stroke-width="1"/>
<text x="84" y="504" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#c9d7ea" font-weight="400">Observed (QEMU, exact Image): calls=114 scans=20589 moved=8323 · stack with ktramp: ktramp calls=64 vh scans=17641 moved=5175</text>
</svg>
