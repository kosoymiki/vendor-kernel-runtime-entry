<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="t d">
<title id="t">Entry-point matrix</title>
<desc id="d">Which runtime mechanisms are proven, experimental or closed on the reference kernel.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="55%" stop-color="#0b1224"/>
    <stop offset="100%" stop-color="#070b16"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#121f38" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0f1a2e" stop-opacity="0.95"/>
  </linearGradient>
  <radialGradient id="glowc"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowv"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1b2740" stroke-width="1" stroke-opacity="0.5"/>
  </pattern>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa3bf"/></marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>
<rect width="1280" height="780" fill="url(#bg)"/>
<rect width="1280" height="780" fill="url(#grid)" opacity="0.35"/>
<circle cx="153" cy="0" r="409" fill="url(#glowc)"/>
<circle cx="1177" cy="780" r="358" fill="url(#glowv)"/>
<text x="64" y="64" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#22d3ee" font-weight="700" letter-spacing="3">ENTRY-POINT MATRIX</text>
<text x="64" y="104" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" fill="#e8eefb" font-weight="800">What the entry can do — measured, not assumed</text>
<text x="64" y="132" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8fa3bf" font-weight="400">Reference: RMX3709 5.10.236 · QEMU on the exact stock Image · maxcpus=1</text>
<rect x="64" y="168" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="168" width="280" height="4" rx="2" fill="#34d399" opacity="0.85"/>
<text x="82" y="210" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">LKM + CFI bridge</text>
<rect x="82" y="224" width="56" height="21" rx="10.5" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="91" y="238.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399" font-weight="600">proven</text>
<text x="82" y="270" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">module init/exit + callbacks run</text>
<rect x="354" y="168" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="354" y="168" width="280" height="4" rx="2" fill="#34d399" opacity="0.85"/>
<text x="372" y="210" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">kprobe / kretprobe</text>
<rect x="372" y="224" width="56" height="21" rx="10.5" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="381" y="238.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399" font-weight="600">proven</text>
<text x="372" y="270" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">resolve symbols, patch args at return</text>
<rect x="644" y="168" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="644" y="168" width="280" height="4" rx="2" fill="#34d399" opacity="0.85"/>
<text x="662" y="210" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">text patch</text>
<rect x="662" y="224" width="56" height="21" rx="10.5" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="671" y="238.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399" font-weight="600">proven</text>
<text x="662" y="270" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">replace a live function, then restore</text>
<rect x="934" y="168" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="934" y="168" width="280" height="4" rx="2" fill="#34d399" opacity="0.85"/>
<text x="952" y="210" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">trampoline</text>
<rect x="952" y="224" width="56" height="21" rx="10.5" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="961" y="238.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399" font-weight="600">proven</text>
<text x="952" y="270" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">copied prologue -&gt; wrapper -&gt; branch back</text>
<rect x="64" y="314" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="314" width="280" height="4" rx="2" fill="#34d399" opacity="0.85"/>
<text x="82" y="356" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">raw payload</text>
<rect x="82" y="370" width="56" height="21" rx="10.5" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="91" y="384.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399" font-weight="600">proven</text>
<text x="82" y="416" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">module_alloc + set_memory_x + icache flush</text>
<rect x="354" y="314" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="354" y="314" width="280" height="4" rx="2" fill="#34d399" opacity="0.85"/>
<text x="372" y="356" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">kallsyms via kprobe</text>
<rect x="372" y="370" width="56" height="21" rx="10.5" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="381" y="384.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399" font-weight="600">proven</text>
<text x="372" y="416" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">non-exported symbols resolved</text>
<rect x="644" y="314" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="644" y="314" width="280" height="4" rx="2" fill="#34d399" opacity="0.85"/>
<text x="662" y="356" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">procfs / sysfs</text>
<rect x="662" y="370" width="56" height="21" rx="10.5" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="671" y="384.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399" font-weight="600">proven</text>
<text x="662" y="416" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">status and control surfaces</text>
<rect x="934" y="314" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="934" y="314" width="280" height="4" rx="2" fill="#fbbf24" opacity="0.85"/>
<text x="952" y="356" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">BPF</text>
<rect x="952" y="370" width="62" height="21" rx="10.5" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.45"/>
<text x="961" y="384.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#fbbf24" font-weight="600">observe</text>
<text x="952" y="416" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">tracing only, verifier limits</text>
<rect x="64" y="460" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="460" width="280" height="4" rx="2" fill="#fb7185" opacity="0.85"/>
<text x="82" y="502" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">ftrace function tracer</text>
<rect x="82" y="516" width="56" height="21" rx="10.5" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity="0.45"/>
<text x="91" y="530.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#fb7185" font-weight="600">closed</text>
<text x="82" y="562" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">CONFIG_FUNCTION_TRACER unset</text>
<rect x="354" y="460" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="354" y="460" width="280" height="4" rx="2" fill="#fb7185" opacity="0.85"/>
<text x="372" y="502" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">livepatch</text>
<rect x="372" y="516" width="56" height="21" rx="10.5" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity="0.45"/>
<text x="381" y="530.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#fb7185" font-weight="600">closed</text>
<text x="372" y="562" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">CONFIG_LIVEPATCH unset</text>
<rect x="644" y="460" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="644" y="460" width="280" height="4" rx="2" fill="#fb7185" opacity="0.85"/>
<text x="662" y="502" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">kexec</text>
<rect x="662" y="516" width="56" height="21" rx="10.5" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity="0.45"/>
<text x="671" y="530.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#fb7185" font-weight="600">closed</text>
<text x="662" y="562" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">CONFIG_KEXEC unset</text>
<rect x="934" y="460" width="280" height="132" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="934" y="460" width="280" height="4" rx="2" fill="#fb7185" opacity="0.85"/>
<text x="952" y="502" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#e8eefb" font-weight="700">devmem / multikernel</text>
<rect x="952" y="516" width="56" height="21" rx="10.5" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity="0.45"/>
<text x="961" y="530.28" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#fb7185" font-weight="600">closed</text>
<text x="952" y="562" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8fa3bf" font-weight="400">configs unset</text>
<text x="64" y="736" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="400">Single-CPU QEMU result. On SMP, text patching needs aarch64_insn_patch_text / stop_machine — nosync is not safe there.</text>
</svg>
