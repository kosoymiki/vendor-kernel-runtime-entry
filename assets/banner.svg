<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">Vendor Kernel Runtime Entry</title>
<desc id="d">Hero banner: runtime module library for vendor-frozen kernels.</desc>
<defs>
