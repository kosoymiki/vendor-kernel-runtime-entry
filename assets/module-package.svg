<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
<title id="t">Module package install path</title>
<desc id="d">How module.zip is installed, verified and rolled back on a KernelSU device.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="55%" stop-color="#0b1224"/>
    <stop offset="100%" stop-color="#070b16"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#121f38" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0f1a2e" stop-opacity="0.95"/>
  </linearGradient>
  <radialGradient id="glowc"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowv"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1b2740" stroke-width="1" stroke-opacity="0.5"/>
  </pattern>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa3bf"/></marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>
<rect width="1280" height="340" fill="url(#bg)"/>
<rect width="1280" height="340" fill="url(#grid)" opacity="0.35"/>
<circle cx="153" cy="0" r="409" fill="url(#glowc)"/>
<circle cx="1177" cy="340" r="358" fill="url(#glowv)"/>
<text x="64" y="60" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#22d3ee" font-weight="700" letter-spacing="3">PACKAGE</text>
<text x="64" y="98" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" fill="#e8eefb" font-weight="800">module.zip on a KernelSU device</text>
<text x="64" y="126" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8fa3bf" font-weight="400">The packaged .ko is valid for one profile. Verify the hash before flashing.</text>
<rect x="64" y="154" width="208" height="108" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="154" width="208" height="4" rx="2" fill="#22d3ee" opacity="0.85"/>
<text x="80" y="184" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#22d3ee" font-weight="700">1</text>
<text x="80" y="208" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700">install</text>
<text x="80" y="230" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa3bf" font-weight="400">ksud module install module.zip</text>
<path d="M274 208.0 L290 208.0" stroke="#8fa3bf" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#arw)"/>
<rect x="294" y="154" width="208" height="108" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="294" y="154" width="208" height="4" rx="2" fill="#60a5fa" opacity="0.85"/>
<text x="310" y="184" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#60a5fa" font-weight="700">2</text>
<text x="310" y="208" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700">boot</text>
<text x="310" y="230" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa3bf" font-weight="400">post-fs-data.sh: insmod</text>
<text x="310" y="244" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa3bf" font-weight="400">bin/kbootstrap.ko</text>
<path d="M504 208.0 L520 208.0" stroke="#8fa3bf" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#arw)"/>
<rect x="524" y="154" width="208" height="108" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="524" y="154" width="208" height="4" rx="2" fill="#34d399" opacity="0.85"/>
<text x="540" y="184" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#34d399" font-weight="700">3</text>
<text x="540" y="208" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700">verify</text>
<text x="540" y="230" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa3bf" font-weight="400">cat /proc/kbootstrap → status</text>
<text x="540" y="244" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa3bf" font-weight="400">surface</text>
<path d="M734 208.0 L750 208.0" stroke="#8fa3bf" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#arw)"/>
<rect x="754" y="154" width="208" height="108" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="754" y="154" width="208" height="4" rx="2" fill="#fbbf24" opacity="0.85"/>
<text x="770" y="184" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#fbbf24" font-weight="700">4</text>
<text x="770" y="208" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700">observe</text>
<text x="770" y="230" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa3bf" font-weight="400">service.sh records the same</text>
<text x="770" y="244" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa3bf" font-weight="400">status</text>
<path d="M964 208.0 L980 208.0" stroke="#8fa3bf" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#arw)"/>
<rect x="984" y="154" width="208" height="108" rx="14" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="984" y="154" width="208" height="4" rx="2" fill="#a78bfa" opacity="0.85"/>
<text x="1000" y="184" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#a78bfa" font-weight="700">5</text>
<text x="1000" y="208" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700">rollback</text>
<text x="1000" y="230" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa3bf" font-weight="400">reboot — the module is never</text>
<text x="1000" y="244" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa3bf" font-weight="400">rmmod'd live</text>
<text x="64" y="302" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="400">Reference profile: RMX3709 · 5.10.236 · aarch64. Another kernel needs tools/adapt_kernel.sh — never install a foreign .ko.</text>
</svg>
