<rect x="64" y="398" width="1152" height="44" rx="12" fill="#0b1424" stroke="#1e2b45" stroke-width="1"/>
<text x="84" y="425" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9d7ea" font-weight="400">Hard rule: a probe is not a backport. Stage M3/M4 land only with QEMU behavior evidence and an explicit gap list.</text>
