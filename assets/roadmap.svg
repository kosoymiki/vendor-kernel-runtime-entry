<text x="790" y="300" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700" text-anchor="middle">Policy hooks</text>
<text x="790" y="320" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8fa3bf" font-weight="400" text-anchor="middle">reclaim policy modes,</text>
<text x="790" y="335" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8fa3bf" font-weight="400" text-anchor="middle">generation side table</text>
<text x="790" y="372" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#fbbf24" font-weight="600" text-anchor="middle">in progress</text>
<circle cx="1010" cy="258" r="13" fill="#070b16" stroke="#64748b" stroke-width="3"/>
<circle cx="1010" cy="258" r="5" fill="#64748b"/>
<text x="1010" y="226" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle">M4</text>
<text x="1010" y="300" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700" text-anchor="middle">7.4 backport</text>
