<text x="340" y="372" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399" font-weight="600" text-anchor="middle">done</text>
<circle cx="560" cy="258" r="13" fill="#070b16" stroke="#34d399" stroke-width="3"/>
<circle cx="560" cy="258" r="5" fill="#34d399"/>
<text x="560" y="226" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#34d399" font-weight="700" text-anchor="middle">M2</text>
<text x="560" y="300" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#e8eefb" font-weight="700" text-anchor="middle">Trampoline</text>
<text x="560" y="320" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8fa3bf" font-weight="400" text-anchor="middle">get_scan_count replaced,</text>
<text x="560" y="335" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8fa3bf" font-weight="400" text-anchor="middle">426 calls, restore</text>
<text x="560" y="372" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399" font-weight="600" text-anchor="middle">done</text>
