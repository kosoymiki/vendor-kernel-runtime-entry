<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="t d">
<title id="t">Runtime entry architecture</title>
<desc id="d">Five layers from a locked boot chain to the module library.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="55%" stop-color="#0b1224"/>
    <stop offset="100%" stop-color="#070b16"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#121f38" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0f1a2e" stop-opacity="0.95"/>
  </linearGradient>
  <radialGradient id="glowc"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowv"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1b2740" stroke-width="1" stroke-opacity="0.5"/>
  </pattern>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa3bf"/></marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>
<rect width="1280" height="860" fill="url(#bg)"/>
<rect width="1280" height="860" fill="url(#grid)" opacity="0.35"/>
<circle cx="153" cy="0" r="409" fill="url(#glowc)"/>
<circle cx="1177" cy="860" r="358" fill="url(#glowv)"/>
<text x="64" y="66" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#22d3ee" font-weight="700" letter-spacing="3">ARCHITECTURE</text>
<text x="64" y="108" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" fill="#e8eefb" font-weight="800">From a locked boot chain to a running module</text>
<text x="64" y="138" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#8fa3bf" font-weight="400">Each layer exists because the layer above it refused something. Only the last one changes the kernel.</text>
<rect x="64" y="178" width="1152" height="108" rx="16" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="178" width="5" height="108" rx="2.5" fill="#8fa3bf" opacity="0.9"/>
<text x="92" y="222" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="26" fill="#8fa3bf" font-weight="800">0</text>
<text x="126" y="220" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#e8eefb" font-weight="700">Boot chain</text>
<text x="126" y="244" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8fa3bf" font-weight="400">bootloader locked · no kernel flash · vendor Image</text>
<rect x="560" y="208" width="118.6" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="571" y="226" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">Image 5.10.236</text>
<rect x="686.6" y="208" width="84.1" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="697.6" y="226" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">MODULES=y</text>
<rect x="778.7" y="208" width="125.5" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="789.7" y="226" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">CFI_CLANG + LTO</text>
<rect x="1123.0" y="200" width="57" height="22" rx="11.0" fill="#8fa3bf" fill-opacity="0.12" stroke="#8fa3bf" stroke-opacity="0.45"/>
<text x="1135.0" y="214.96" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8fa3bf" font-weight="600">given</text>
<path d="M640 286 L640 306" stroke="#8fa3bf" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#arw)"/>
<rect x="64" y="306" width="1152" height="108" rx="16" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="306" width="5" height="108" rx="2.5" fill="#22d3ee" opacity="0.9"/>
<text x="92" y="350" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="26" fill="#22d3ee" font-weight="800">1</text>
<text x="126" y="348" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#e8eefb" font-weight="700">Loader compatibility</text>
<text x="126" y="372" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8fa3bf" font-weight="400">make the vendor loader accept a foreign build</text>
<rect x="560" y="336" width="153.1" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="571" y="354" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">vermagic + .modinfo</text>
<rect x="721.1" y="336" width="118.6" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="732.1" y="354" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">__versions CRC</text>
<rect x="1116.4" y="328" width="64" height="22" rx="11.0" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="1128.4" y="342.96" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#34d399" font-weight="600">proven</text>
<path d="M640 414 L640 434" stroke="#8fa3bf" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#arw)"/>
<rect x="64" y="434" width="1152" height="108" rx="16" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="434" width="5" height="108" rx="2.5" fill="#a78bfa" opacity="0.9"/>
<text x="92" y="478" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="26" fill="#a78bfa" font-weight="800">2</text>
<text x="126" y="476" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#e8eefb" font-weight="700">CFI bridge</text>
<text x="126" y="500" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8fa3bf" font-weight="400">module-local CFI scaffolding, no kernel-wide change</text>
<rect x="560" y="464" width="132.39999999999998" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="571" y="482" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">__cfi_check: ret</text>
<rect x="700.4" y="464" width="166.9" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="711.4" y="482" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">__cfi_jt_init/cleanup</text>
<rect x="1116.4" y="456" width="64" height="22" rx="11.0" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="1128.4" y="470.96" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#34d399" font-weight="600">proven</text>
<path d="M640 542 L640 562" stroke="#8fa3bf" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#arw)"/>
<rect x="64" y="562" width="1152" height="108" rx="16" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="562" width="5" height="108" rx="2.5" fill="#60a5fa" opacity="0.9"/>
<text x="92" y="606" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="26" fill="#60a5fa" font-weight="800">3</text>
<text x="126" y="604" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#e8eefb" font-weight="700">Runtime entry</text>
<text x="126" y="628" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8fa3bf" font-weight="400">what the module can actually do inside the kernel</text>
<rect x="560" y="592" width="132.39999999999998" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="571" y="610" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">kprobe/kretprobe</text>
<rect x="700.4" y="592" width="91.0" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="711.4" y="610" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">text patch</text>
<rect x="799.4" y="592" width="91.0" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="810.4" y="610" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">trampoline</text>
<rect x="1116.4" y="584" width="64" height="22" rx="11.0" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
<text x="1128.4" y="598.96" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#34d399" font-weight="600">proven</text>
<path d="M640 670 L640 690" stroke="#8fa3bf" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#arw)"/>
<rect x="64" y="690" width="1152" height="108" rx="16" fill="url(#cardg)" stroke="#22314e" stroke-width="1"/>
<rect x="64" y="690" width="5" height="108" rx="2.5" fill="#34d399" opacity="0.9"/>
<text x="92" y="734" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="26" fill="#34d399" font-weight="800">4</text>
<text x="126" y="732" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#e8eefb" font-weight="700">Module library</text>
<text x="126" y="756" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8fa3bf" font-weight="400">reusable, versioned modules built on those entries</text>
<rect x="560" y="720" width="91.0" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="571" y="738" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">kbootstrap</text>
<rect x="659.0" y="720" width="63.4" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="670.0" y="738" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">kpatch</text>
<rect x="730.4" y="720" width="63.4" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="741.4" y="738" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">ktramp</text>
<rect x="801.8" y="720" width="97.89999999999999" height="26" rx="8" fill="#0b1424" stroke="#24344f" stroke-width="1"/>
<text x="812.8" y="738" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#c9d7ea" font-weight="500">mglru_probe</text>
<rect x="1109.8" y="712" width="70" height="22" rx="11.0" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.45"/>
<text x="1121.8" y="726.96" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#fbbf24" font-weight="600">growing</text>
<text x="64" y="826" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="400">Nothing above the CFI bridge is kernel-wide: the bridge disables CFI checks for the module only. Treat every module as trusted code.</text>
</svg>
